name: KVRAT Core CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn requests pytest

    - name: Validate Core Engine Files
      run: |
        python -c "import src.api_server; print('API Server Syntax OK')"
        python -c "import src.agents.swarm; print('Agentic Swarm Syntax OK')"

  docker-build-check:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Build Docker Image
      run: |
        docker build -t kvrat/core-engine:latest .
