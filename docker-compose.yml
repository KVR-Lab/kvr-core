version: '3.8'

services:
  api:
    build: .
    container_name: kvrat_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - MAX_WEIGHT_LIMIT=100.0

  dashboard:
    build: .
    container_name: kvrat_dashboard
    command: python -m streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api
