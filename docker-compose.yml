version: '3.8'

services:
  kvrat-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kvrat_core_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
